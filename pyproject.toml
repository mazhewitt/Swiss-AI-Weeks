[project]
name = "recurring-family"
version = "0.1.0"
description = "Next Recurring Family prediction for the Swiss{ai}Weeks 2026 challenge"
readme = "SOLUTION.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
]

[project.scripts]
rf = "recurring_family.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recurring_family"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: real-data checks, run on request with -m slow"]
